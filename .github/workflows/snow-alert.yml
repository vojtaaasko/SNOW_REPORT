
name: SNOW ALERT

on:
  schedule:
    - cron: "13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snow-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run snow alert
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python main.py
